name: macOS CI
run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'Release' || 'Build' }}
  · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      dmg_name: ${{ steps.package.outputs.dmg_name }}
    env: &macos_env
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag and changelog
        if: &is_release github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: python3 script/release_notes.py "$GITHUB_REF_NAME" > /dev/null

      - name: Show toolchain
        run: |
          echo "MODU_DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          xcodebuild -version
          sw_vers

      - name: Restore Swift packages
        id: packages
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with: &package_cache
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-swiftpm-${{ hashFiles('ModuDesktop.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.48.0'

      - name: Build and package arm64 app
        id: package
        env:
          MODU_PACKAGE_DIR: ${{ runner.temp }}/package
        run: task package

      - name: Save Swift packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with: *package_cache

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.dmg_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test (${{ matrix.shard }}/4)
    if: *is_release
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env: *macos_env
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          echo "MODU_DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          xcodebuild -version
          sw_vers

      - name: Restore Swift packages
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with: *package_cache

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.48.0'

      - name: Test before release
        id: tests
        run: task test TEST_SHARD=${{ matrix.shard }} -- -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"

      - name: Upload failed test results
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

  release:
    if: *is_release
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare release notes
        run: |
          python3 script/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'

          ## 安装说明

          适用于 Apple Silicon（arm64），最低 macOS 26.5。此安装包采用 ad-hoc 签名，未做 Developer ID 签名或 Apple 公证。
          EOF

      - name: Download DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.dmg_name }}
          path: package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_NAME: ${{ needs.build.outputs.dmg_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" "package/$DMG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
